[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "homescout-api"
version = "0.1.0"
description = "HomeScout Kenya API foundation"
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "SQLAlchemy==2.1.9",
    "alembic==1.20.1",
    "pydantic-settings==2.16.3",
    "psycopg[binary]==3.3.9",
    "python-dotenv==1.2.4",
    "argon2-cffi==25.1.0",
    "PyJWT==2.15.1",
    "email-validator==2.4.0",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
